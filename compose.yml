services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - personal_ai_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PERSONAL_AI_AGENT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PERSONAL_AI_AGENT_ARTIFACT_ROOT: /var/lib/personal-ai-agent/artifacts
      PERSONAL_AI_AGENT_CORS_ORIGINS: ${PERSONAL_AI_AGENT_CORS_ORIGINS}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - personal_ai_agent_artifacts:/var/lib/personal-ai-agent/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_DOCS_URL: http://localhost:${DOCS_PORT}
    ports:
      - "${ADMIN_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${DOCS_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

volumes:
  personal_ai_agent_postgres_data:
    name: personal_ai_agent_postgres_data
  personal_ai_agent_artifacts:
    name: personal_ai_agent_artifacts
