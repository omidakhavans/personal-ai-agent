[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-agent"
version = "0.1.0"
description = "Minimal local agent runtime skeleton for the Personal Applied AI Engineering project."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy==1.20.2",
  "ruff==0.16.10",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["runs"]

[tool.ruff.lint]
# These checks catch real Python mistakes, import drift, and brittle control
# flow without imposing a framework or rewriting the runtime's JSON boundary.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["personal_ai_agent"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
